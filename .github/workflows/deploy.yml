name: Deploy to Azure VM

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              cd /var/www/coach-engine/prod
              git pull origin main
              sudo systemctl restart coach-engine-prod
            else
              cd /var/www/coach-engine/dev
              git pull origin dev
              sudo systemctl restart coach-engine-dev
            fi
